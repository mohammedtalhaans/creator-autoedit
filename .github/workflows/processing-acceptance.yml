name: Actual local models acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Model downloads are intentionally bounded to one Chromium worker. WebKit codec/model
      # coverage remains a separate device check and is never inferred from this job.
      - run: npx playwright test --config playwright.models.config.ts --project=chromium
      - run: npx playwright test --config playwright.models.production.config.ts --project=chromium
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: actual-model-evidence
          path: |
            playwright-report/models
            test-results/models
